<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Магазин</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#e6e6e6;padding:24px 20px;min-height:100vh}.wrap{max-width:640px;margin:0 auto}.h{font-size:1.6rem;font-weight:600;color:#fff;letter-spacing:-0.03em;margin-bottom:4px}.s{color:#666;font-size:0.85rem;margin-bottom:32px}.card{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:18px;margin-bottom:12px;display:flex;align-items:center;transition:border 0.15s}.card:active{border-color:#2a2a2a}.ic{width:52px;height:52px;background:#1a1a1a;border-radius:12px;margin-right:16px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#444;flex-shrink:0;font-weight:600}.inf{flex:1;min-width:0}.inf h3{margin:0 0 4px;font-size:0.98rem;font-weight:600;color:#fff;word-break:break-word;letter-spacing:-0.01em}.inf p{margin:0;font-size:0.8rem;color:#666;word-break:break-word;line-height:1.4}.dl{margin-left:12px;background:#fff;color:#000;padding:9px 16px;border-radius:9px;text-decoration:none;font-weight:600;font-size:0.78rem;white-space:nowrap;letter-spacing:-0.01em}.empty{text-align:center;color:#444;margin-top:80px;font-size:0.9rem}</style></head><body><div class="wrap"><h1 class="h">Магазин</h1><p class="s">Приложения</p><div id="c"><div class="empty">Загрузка...</div></div></div><script>async function load(){try{var r=await fetch("apps.json?t="+Date.now());var a=await r.json();var c=document.getElementById("c");if(!a||a.length===0){c.innerHTML="<div class=\"empty\">Пока нет приложений</div>";return}c.innerHTML=a.reverse().map(function(x,i){var letter=(x.name||"?").charAt(0).toUpperCase();return "<div class=\"card\"><div class=\"ic\">"+letter+"</div><div class=\"inf\"><h3>"+x.name+"</h3><p>"+(x.description||"")+"</p></div><a class=\"dl\" href=\""+x.url+"\" download>Скачать</a></div>"}).join("");}catch(e){document.getElementById("load")&&(document.getElementById("load").innerText="Ошибка")}}load();setInterval(load,15000);</script></body></html>
