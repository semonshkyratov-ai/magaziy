<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Админ</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#e6e6e6;padding:20px;line-height:1.5}.wrap{max-width:560px;margin:0 auto}h1{font-size:1.2rem;font-weight:600;color:#fff;margin-bottom:16px}label{display:block;font-size:0.78rem;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-top:14px;margin-bottom:6px}input{width:100%;padding:12px 14px;background:#141414;border:1px solid #242424;border-radius:10px;color:#fff;font-size:0.9rem}button{width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:600;font-size:0.9rem;margin-top:18px;cursor:pointer}#log{margin-top:16px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:0.72rem;line-height:1.7;max-height:320px;overflow-y:auto;color:#666}.ok{color:#4ade80}.err{color:#f87171}.info{color:#60a5fa}</style></head><body><div class="wrap"><h1>Загрузить приложение</h1><label>GitHub токен</label><input type="password" id="token"><label>Владелец</label><input type="text" id="owner"><label>Репозиторий</label><input type="text" id="repo" value="magazin"><label>APK файл</label><input type="file" id="apk" accept=".apk"><label>Название</label><input type="text" id="name"><label>Описание</label><input type="text" id="desc"><button onclick="up()">Загрузить</button><div id="log">Ожидание...</div></div><script>var API="https://api.github.com";function log(m,c){var l=document.getElementById("log");l.innerHTML+="<div class=\""+(c||"info")+"\">"+m+"</div>";l.scrollTop=l.scrollHeight}async function api(ep,opt){var t=document.getElementById("token").value.trim();var h={"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(!opt.raw)h["Content-Type"]="application/json";var r=await fetch(API+ep,Object.assign({},opt,{headers:h}));if(!r.ok){var e=await r.json().catch(function(){return {}});throw new Error(r.status+": "+(e.message||""))}return r.json()}function b64(s){return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(m,p){return String.fromCharCode("0x"+p)}))}async function up(){var owner=document.getElementById("owner").value.trim();var repo=document.getElementById("repo").value.trim();var f=document.getElementById("apk").files[0];var name=document.getElementById("name").value.trim();var desc=document.getElementById("desc").value.trim();var token=document.getElementById("token").value.trim();if(!f||!name||!owner||!repo){alert("Заполни всё");return}log("Чтение "+f.name+"...");try{var buf=await f.arrayBuffer();log("Создание релиза...");var rid;try{var rel=await api("/repos/"+owner+"/"+repo+"/releases",{method:"POST",body:JSON.stringify({tag_name:"apps",name:"Apps"})});rid=rel.id;}catch(e){var rels=await api("/repos/"+owner+"/"+repo+"/releases");rid=rels.find(function(r){return r.tag_name==="apps"}).id;}log("Загрузка APK...");var ur="https://uploads.github.com/repos/"+owner+"/"+repo+"/releases/"+rid+"/assets?name="+encodeURIComponent(f.name);var r=await fetch(ur,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/vnd.android.package-archive"},body:buf});if(!r.ok)throw new Error("upload "+r.status);var a=await r.json();log("Обновление apps.json...");var cf=await api("/repos/"+owner+"/"+repo+"/contents/apps.json");var apps=[];try{apps=JSON.parse(decodeURIComponent(escape(atob(cf.content.replace(/\n/g,"")))))}catch(e){apps=[]}apps.push({name:name,description:desc,url:a.browser_download_url,size:(f.size/1048576).toFixed(1)+" MB"});await api("/repos/"+owner+"/"+repo+"/contents/apps.json",{method:"PUT",body:JSON.stringify({message:"Add "+name,content:b64(JSON.stringify(apps,null,2)),sha:cf.sha})});log("Готово!","ok");}catch(e){log("Ошибка: "+e.message,"err")}}</script></body></html>
